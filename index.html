<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lumin Startpage</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <section class="top">
      <div id="searchbar-target"></div>
      <div class="top-right" id="clock-weather-target"></div>
    </section>

    <section class="middle">
      <div class="middle-left" id="anki-target"></div>

      <div class="middle-center">
        <div class="glass-box">
          <div class="glass-box-left" id="todo-target"></div>
          <div class="glass-box-right" id="tabs-target"></div>
        </div>
      </div>

      <div class="middle-lute" id="lute-target"></div>
    </section>

    <section class="bottom">
      <div class="dock-container" id="bookmarks-target"></div>
    </section>

  </div>

  <div id="context-menu-target"></div>
  <div id="modal-target"></div>

  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

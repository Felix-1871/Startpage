<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layout Reproduction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <section class="top">
      <div class="top-inner-container">
        <div class="top-left">Welcome!</div> <!-- Todo: Make random quotes from a list of quotes or some api idk -->
      </div>
      <div class="top-right">
        <div class="clock-weather-container">
          <span id="current-time"></span>
          <span id="current-weather"></span>
        </div>
      </div>
    </section>

    <section class="middle">
      <div class="middle-left">
        <div class="bookmarks-container">
          <ul class="bookmarks-list" id="bookmarks-list">
            <!-- Bookmarks populated by JS -->
          </ul>
        </div>
      </div>
      <div class="middle-center">
        <div class="glass-box">
          <div class="glass-box-left">
            <div id="todo-list-display"></div>
            <div id="todo-input-container"></div>
          </div>
          <div class="glass-box-right">
            <div class="categories-header">
              <ul id="category-list"></ul>
            </div>
            <div class="links-grid" id="links-grid">

            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="bottom">
      <div class="bottom-input-container">
        <div class="custom-dropdown browser-dropdown">
          <input type="text" id="search-engine-select" class="custom-dropdown-input" placeholder="Search Engine" readonly>
          <span class="dropdown-arrow"></span>
          <input type="hidden" id="search-engine-select_hidden" data-setting-key="searchEngine.selected">
          <div class="custom-dropdown-list" id="search-engine-select-dropdown-list"></div>
        </div>
        <input type="text" id="main-input" class="bottom-input" placeholder="Enter command...">
        <span class="search-arrow">▶</span>
      </div>
    </section>

  </div>

  <div id="context-menu" class="context-menu" style="display: none;"></div>

  <script type="module" src="./src/config.js"></script>
  <script type="module" src="./src/tabs.js"></script>
  <script type="module" src="./src/searchBar.js"></script>
  <script type="module" src="./src/clock-weather.js"></script>
  <script type="module" src="./src/todo.js"></script>
  <script type="module" src="./src/contextMenu.js"></script>
</body>
<div id="modal-container" class="modal-overlay" style="display: none;"></div>
</html>
